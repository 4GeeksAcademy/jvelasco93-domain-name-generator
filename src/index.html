<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="./assets/img/4geeks.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Domain Name Generator</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.2.0/css/all.css"
    integrity="sha384-hWVjflwFxL6sNzntih27bfxkr27PmbbK/iSvJ+a4+0owXq79v+lsFkW54bOGbiDQ" crossorigin="anonymous" />
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <div class="container py-4">
    <h1 class="text-center mb-4">Domain Name Generator</h1>

    <div class="row g-4">
      <!-- Pronouns -->
      <div class="col-12 col-md-4">
        <div class="card h-100">
          <div class="card-body">
            <h2 class="card-title">Pronouns</h2>
            <div class="d-flex gap-2 mb-3">
              <input type="text" id="pronoun-input" class="form-control" placeholder="Add pronoun" />
              <button type="button" id="add-pronoun-btn" class="btn btn-primary">
                Add
              </button>
            </div>
            <ul id="pronouns-list" class="list-group"></ul>
          </div>
        </div>
      </div>

      <!-- Adjectives -->
      <div class="col-12 col-md-4">
        <div class="card h-100">
          <div class="card-body">
            <h2 class="card-title">Adjectives</h2>
            <div class="d-flex gap-2 mb-3">
              <input type="text" id="adjective-input" class="form-control" placeholder="Add adjective" />
              <button type="button" id="add-adjective-btn" class="btn btn-primary">
                Add
              </button>
            </div>
            <ul id="adjectives-list" class="list-group"></ul>
          </div>
        </div>
      </div>

      <!-- Nouns -->
      <div class="col-12 col-md-4">
        <div class="card h-100">
          <div class="card-body">
            <h2 class="card-title">Nouns</h2>
            <div class="d-flex gap-2 mb-3">
              <input type="text" id="noun-input" class="form-control" placeholder="Add noun" />
              <button type="button" id="add-noun-btn" class="btn btn-primary">
                Add
              </button>
            </div>
            <ul id="nouns-list" class="list-group"></ul>
          </div>
        </div>
      </div>
    </div>

    <!-- Generated Domains -->
    <div class="row mt-5">
      <div class="col-12">
        <div class="card">
          <div class="card-body">
            <h2 class="card-title mb-3">Generated Domains</h2>
            <ul id="domain-list" class="list-group"></ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>

</html>
